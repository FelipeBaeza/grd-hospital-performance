# Reglas de calidad declarativas (lote 1: fechas, identificador y duplicados).
# Cada regla indica qué mide (tipo), sobre qué columnas, qué tan grave es y qué se hace con el dato:
#   accion = anular           -> se anula el valor erróneo y se conserva el episodio (regla R5)
#          | recodificar      -> se lleva a la categoría estándar
#          | excluir          -> se excluye el episodio de un análisis concreto (no se borra)
#          | informar_fonasa  -> se informa a FONASA por un canal formal
#          | informar         -> solo se registra
# permite_expuesto = true significa que la regla solo devuelve indicadores de violación y puede leer las
# columnas de resultado del año expuesto (2024) en claro (cortafuegos). Nunca devuelve distribuciones de resultado.
# alcance = "anio" evalúa cada archivo anual; "regimen" evalúa un conjunto de años que comparten espacio de IDs.

[[regla]]
id = "Q01"
nombre = "Fecha de nacimiento vacía"
tipo = "vacio"
columnas = ["FECHA_NACIMIENTO"]
severidad = "media"
accion = "informar"
permite_expuesto = true
alcance = "anio"
referencia = "Fase 2, sección 4.1 (el diccionario dice 0 vacíos y el repositorio reporta 37)"
descripcion = "La fecha de nacimiento es nula; la edad no se puede calcular."

[[regla]]
