# Enmienda 02 al protocolo de la Fase 5 (versión 3.0): datos y cohortes. Texto explicado: documentos/ENMIENDA_02.md.
# No tiene validez hasta que exista documentos/registro_enmienda_02.json con su huella y la firma del autor
# (python registrar_enmienda.py --enmienda 2 firmar ...). El profesor guía la firma después de los resultados (decisión del autor, 22-10-2026). Después de firmado no se cambia: un cambio exige una enmienda nueva.
# El protocolo v1.0 y la enmienda 01 siguen vigentes; el v1.0 define el resultado primario.
version = "3.0"
enmienda = 2
protocolo_base = "config/protocolo_fase5_v2.toml"
huella_base = "0f199fb8270cf74fd8d4c3c8ed2a36a73c9015f38a880317710cf5e3a0f9b454"
texto = "documentos/ENMIENDA_02.md"
semilla = 20261019

[resultado_primario]
congelado = true
descripcion = "Modelos de la Fase 4, protocolo v1.0 y tablas de salidas/evaluacion_2024: no se modifican, no se re-etiquetan y no se reemplazan."
codigo_con_opcion_apagada = "Los cambios de código de las Fases 3 y 5 quedan detrás de una opción apagada por defecto; sin ella, cascadas, capas Oro y cohortes evaluadas son idénticas byte a byte."

[disenos.anidado]
entrenar = [2019, 2020, 2021]
calibrar = 2022
probar = 2023
rol = "resultado de la enmienda (no usa 2024)"

[disenos.original]
entrenar = [2019, 2020, 2021, 2022]
calibrar = 2023
probar = 2024
rol = "secundario, rotulado 'ya abierto'"

[receta]
igual_que = "enmienda 01 ([receta] de protocolo_fase5_v2.toml)"
cambio_de_cohorte = "se aplica a la vez en entrenamiento, calibración y prueba"
base_de_comparacion = "la variante base del mismo diseño y la misma tarea (la de la enmienda 01)"
comparacion_por_hospital = "sobre los hospitales elegibles en las dos versiones"

[regla_lectura]
igual_que = "enmienda 01"
min_misma_zona = 0.80
min_rho = 0.90

[publicacion]
igual_que = "enmienda 01"
tasas_por_hospital = "una tasa de contexto se publica solo si su conteo es 0 o al menos 10; con conteos de 1 a 9 se suprime"
muertes_obstetricas = "solo el total 2019-2023, sin desglose por hospital ni por año"

[decisiones]
ex03 = "conservadora: se excluye el MDC 14 completo (decisión del autor, 21-10-2026), declarada como limitación"
rol_estancia = "alta voluntaria y fuga salen de la cohorte E; en D siguen como no evento"

