# Enmienda 01 al protocolo de la Fase 5 (versión 2.0). Texto explicado: documentos/ENMIENDA_01.md.
# Este archivo NO tiene validez hasta que exista documentos/registro_enmienda_01.json con su huella y las firmas
# (python registrar_enmienda.py firmar ...). Después de firmado no se cambia: un cambio exige una enmienda nueva.
# El protocolo v1.0 (config/protocolo_fase5.toml) sigue vigente y define el resultado primario.
version = "2.0"
enmienda = 1
protocolo_base = "config/protocolo_fase5.toml"
huella_base = "5624bdae5dad1205081c7765d16046890f5c460667031b336dc21c1e02d42256"
texto = "documentos/ENMIENDA_01.md"
semilla = 20261019

[resultado_primario]
congelado = true
descripcion = "Modelos de la Fase 4, protocolo v1.0 y tablas de salidas/evaluacion_2024: no se modifican, no se re-etiquetan y no se reemplazan. Son el resultado confirmatorio de la tesis."

[disenos.anidado]
entrenar = [2019, 2020, 2021]
calibrar = 2022
probar = 2023
rol = "resultado de la enmienda (no usa 2024)"

[disenos.original]
entrenar = [2019, 2020, 2021, 2022]
calibrar = 2023
probar = 2024
rol = "secundario, rotulado 'ya abierto'"

[receta]
modelo = "LightGBM de cada tarea con los hiperparámetros y el número de árboles congelados en fase4_modelado/modelos/<tarea>/"
recalibracion = { mortalidad = "platt", estadia = "factor_unico" }
cohortes = "las de la Fase 3 y del protocolo v1.0, sin cambios"
indicador = "embudo del protocolo v1.0: winsorización 0,10; z 1,96 y 3,09; mínimo 500 egresos y 10 eventos esperados"
bootstrap = 1000                       # remuestreo de hospitales completos, como en v1.0
nivel = 0.95
base_de_comparacion = "la variante base del mismo diseño y la misma tarea"

[metricas]
modelo_mortalidad = ["auc", "pr_auc", "brier_skill_score", "pendiente_calibracion", "oe_global_con_ic"]
modelo_estadia = ["rmse", "devianza_poisson", "oe_global_con_ic"]
indicador = ["pct_fuera_95", "pct_fuera_998", "tau2", "pct_misma_zona", "rho_spearman_oe", "n_cambian_zona", "fuera_a_dentro", "dentro_a_fuera"]

[regla_lectura]
min_misma_zona = 0.80
min_rho = 0.90
zonas = ["dentro de lo esperado", "alerta alta", "alerta baja", "señal alta", "señal baja"]
texto = "La conclusión de la Fase 5 se mantiene frente a un análisis si al menos el 80 % de los hospitales conserva su zona y la correlación de rangos (Spearman) del O/E por hospital con la base es de al menos 0,90. Si no se cumple, se informa que el indicador no es robusto a esa decisión. El resultado primario no se reemplaza; una variante mejor solo puede adoptarse como versión 2 para el despliegue y validarse en un año nuevo (2025)."

[publicacion]
regla = "Las tablas por hospital de la enmienda siguen las reglas de supresión del protocolo v1.0 (celda mínima 10, también los conteos reconstruibles). Se publican los resúmenes por análisis y la lista de códigos de hospital que cambian de zona, sin conteos."

