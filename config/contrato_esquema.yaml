  # de 5 y 6 caracteres) e IR_29301_PESO es DECIMAL_COMA (ejemplo observado: 0,7094).
  - {nombre: IR_29301_COD_GRD,         orden: 125, formato_origen: ENTERO_TEXTO,  dominio_declarado: "config/mapeo_grd_mdc.csv",            permite_nulo: true}
  - {nombre: IR_29301_PESO,            orden: 126, formato_origen: DECIMAL_COMA,  dominio_declarado: null,                                  permite_nulo: false}
  - {nombre: IR_29301_SEVERIDAD,       orden: 127, formato_origen: TEXTO,         dominio_declarado: null,                                  permite_nulo: true}
  - {nombre: IR_29301_MORTALIDAD,      orden: 128, formato_origen: TEXTO,         dominio_declarado: null,                                  permite_nulo: true}

  # --- Procedencia interhospitalaria (129) ---
  - {nombre: HOSPPROCEDENCIA,          orden: 129, formato_origen: TEXTO,         dominio_declarado: null,                                  permite_nulo: true}

# Los 6 archivos-año de la extracción (R1.1).
#
# `ruta` es paramétrica en `${DATA_DIR}`, que apunta al directorio de la capa cruda.
# La capa cruda es inmutable (R6.10): el contrato sólo lee cabecera y metadatos.
#
# `encoding` refleja la codificación observada archivo por archivo: 2021, 2022 y 2023
# traen marca de orden de bytes al inicio de la cabecera y se leen como `utf-8-sig`;
# 2019, 2020 y 2024 no la traen. Sin esta distinción el primer nombre de columna se
# lee como "\ufeffCOD_HOSPITAL" y el contrato reportaría una deriva de esquema falsa.
#
# `alias` declara la regla ID_BENEFICIARIO → CIP_ENCRIPTADO en los 6 archivos-año
# (R1.5). La regla es declarativa y su aplicación es condicional: sólo se aplica donde
# el archivo trae ID_BENEFICIARIO y no trae CIP_ENCRIPTADO, y toda aplicación deja
# rastro en el informe de deriva de esquema. En la extracción vigente sólo 2024 la
# activa; declararla en los seis evita que un cambio de nomenclatura en una extracción
# futura bloquee la ingesta de otro archivo-año.
archivos:
  - archivo_id: GRD_2019
    ruta: "${DATA_DIR}/GRD_PUBLICO_2019 /GRD_PUBLICO_2019.txt"
    separador: "|"
    encoding: "utf-8"
    alias: {ID_BENEFICIARIO: CIP_ENCRIPTADO}
  - archivo_id: GRD_2020
    ruta: "${DATA_DIR}/GRD_PUBLICO_2020.txt"
    separador: "|"
    encoding: "utf-8"
    alias: {ID_BENEFICIARIO: CIP_ENCRIPTADO}
  - archivo_id: GRD_2021
    ruta: "${DATA_DIR}/GRD_PUBLICO_2021.txt"
    separador: "|"
    encoding: "utf-8-sig"
    alias: {ID_BENEFICIARIO: CIP_ENCRIPTADO}
  - archivo_id: GRD_2022
    ruta: "${DATA_DIR}/GRD_PUBLICO_2022/GRD_PUBLICO_EXTERNO_2022.txt"
    separador: "|"
    encoding: "utf-8-sig"
    alias: {ID_BENEFICIARIO: CIP_ENCRIPTADO}
  - archivo_id: GRD_2023
    ruta: "${DATA_DIR}/GRD_PUBLICO_2023.txt"
    separador: "|"
    encoding: "utf-8-sig"
    alias: {ID_BENEFICIARIO: CIP_ENCRIPTADO}
  - archivo_id: GRD_2024
    ruta: "${DATA_DIR}/GRD_PUBLICO_2024.txt"
    separador: "|"
    encoding: "utf-8"
    alias: {ID_BENEFICIARIO: CIP_ENCRIPTADO}
