# Contrato de esquema de la cohorte GRD — Fase 1
#
# Spec: fase1-cohorte-grd · Componente: Contrato_Esquema (design.md §1)
# Requisitos: R1.1, R1.2, R1.5, R1.8
#
# Este archivo es el esquema de referencia de la cohorte. El código lo lee, no lo
# duplica: `ESQUEMA_REFERENCIA` y `leer_contrato` (tarea 1.2) se construyen desde aquí.
#
# Campos por columna (design.md, dataclass ColumnaContrato):
#   nombre            nombre canónico de la columna en el esquema de referencia
#   orden             posición 1..129 en el archivo de origen (Anexo A.1)
#   formato_origen    TEXTO | FECHA_ISO | FECHA_DMY | DECIMAL_COMA | ENTERO_TEXTO
#                     | CODIGO_CIE10 | CODIGO_CIE9MC
#   dominio_declarado ruta de la tabla de valores que gobierna la columna, o null
#   permite_nulo      si el esquema de referencia admite ausencia de valor
#
# Nota sobre `permite_nulo` (R2, R3): las declaraciones provienen de los conteos de
# no nulos del Anexo A.1, obtenidos con `ignore_errors=True` y por tanto provisorios.
# El Requisito 2 obliga a regenerarlos con ingesta sin supresión de errores y el
# Requisito 3 a reconciliar el denominador antes de citarlos. Toda corrección de este
# campo se hace sobre este archivo, no en el pipeline.

version: 1
esquema_referencia_version: "A.1-129"

columnas:
